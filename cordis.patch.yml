- insert:
    - id: mail-sort
      name: dsh-mail-sort
      config:
        enabled: true
        # ids must match dsh-email `consumers` entries (one per account/folder)
        consumerIds: []
        # account addresses used in the sorting prompt
        accounts: []
        # Telegram group chat id for the summary (required for delivery)
        chatId: ""
        # credentials.yaml ref name holding the Telegram bot token
        telegramTokenRef: ""
        # model used for spawned sorting runs (required)
        provider: ""
        model: ""
